[build]
target = "xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32s3"
# Pin the IDF version so builds are reproducible. v5.3.x is the current LTS-ish.
ESP_IDF_VERSION = "v5.3.1"

# Copy our custom partitions.csv into esp-idf-sys's generated CMake project so
# CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions.csv" resolves. embuild
# globs ESP_IDF_GLOB_<name> files relative to _BASE.
#
# IMPORTANT: the glob matches the name at ANY depth (gitignore-style). The base
# MUST be a dir that does NOT contain `target/`, or it matches the hundreds of
# IDF example partitions.csv files and copies them in a recursive loop until
# paths exceed the OS limit (ENAMETOOLONG). Hence a dedicated cfg/ dir.
ESP_IDF_GLOB_PARTITION_BASE = { value = "./cfg", relative = true }
ESP_IDF_GLOB_PARTITION_CSV = "partitions.csv"
